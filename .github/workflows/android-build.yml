name: Build LinkVault APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME). Just make sure licenses
      # are accepted so Gradle can download platform 35 / build-tools on demand.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: sign release with your own key.
      # Add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug 2>&1 | tee build-debug.log; exit ${PIPESTATUS[0]}

      - name: Show compile errors (debug build failed)
        if: failure()
        run: |
          echo "=== Kotlin/Java/resource/dependency errors ==="
          grep -E "^e: |error:|AAPT: error|Execution failed|Could not resolve|What went wrong" -A2 build-debug.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -120

      # Upload the debug APK before the release build, so a release-only problem (for example the
      # code shrinker) never costs you the debug APK. With ABI splits you get one APK per CPU type
      # plus app-universal-debug.apk, which installs on any phone.
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace 2>&1 | tee build-release.log; exit ${PIPESTATUS[0]}

      - name: Show release build errors
        if: failure()
        run: |
          echo "=== Release build errors (R8 / shrinker / signing) ==="
          grep -E "^e: |error:|ERROR:|Missing class|R8|Execution failed|What went wrong" -A2 build-release.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -120

      - uses: actions/upload-artifact@v4
        with:
          name: LinkVault-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
